version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: qadirdon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qadirdon
      POSTGRES_PASSWORD: password
      POSTGRES_DB: qadirdon_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: qadirdon_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: qadirdon_app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
    ports:
      - "8443:8443"

volumes:
  postgres_data:
  redis_data:
